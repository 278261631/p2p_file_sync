[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pfs"
version = "0.1.0"
description = "P2P folder sharing over WebRTC (publisher / receiver / relay)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiortc>=1.9",
    "websockets>=12",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=7",
]

[project.scripts]
pfs = "pfs.cli.main:main"
pfs-publish = "pfs.gui.app:run_publish"
pfs-receive = "pfs.gui.app:run_receive"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
