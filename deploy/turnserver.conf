# coturn configuration for pfs
#
# Replace the placeholders before deploying. TURN relays traffic only when
# WebRTC hole punching fails, so size the bandwidth/quotas accordingly.

# Public address of this relay, with the private address for NAT hosts.
# external-ip=203.0.113.10/10.0.0.5
external-ip=203.0.113.10

listening-port=3478
fingerprint
lt-cred-mech

realm=pfs.example.com
server-name=pfs.example.com

# Static credentials. For production prefer static-auth-secret + REST API.
# Keep these separate from the signaling server's accounts.
user=pfs:CHANGE_ME

# Relay port range; keep it tight and open UDP in the security group.
min-port=49152
max-port=49200

# Quotas to keep the relay from being abused.
user-quota=12
total-quota=200

no-cli
no-multicast-peers

# Refuse relaying to private / loopback / link-local peers.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
