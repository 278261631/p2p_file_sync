services:
  signal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8765:8765"
    environment:
      PFS_ACCOUNTS: /app/server/accounts.json
    volumes:
      # Edit server/accounts.json on the host; it is picked up without rebuild.
      - ../server/accounts.json:/app/server/accounts.json:ro
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    # Host networking is required for the relay UDP port range.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
