services:
  signal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "18765:18765"
    environment:
      PFS_ACCOUNTS: /app/server/accounts.json
      # Plaintext ws:// is rejected by default. Terminate TLS in a reverse
      # proxy and set this to the proxy's address so X-Forwarded-Proto is
      # trusted. Use "*" only when the proxy is the sole ingress.
      # FORWARDED_ALLOW_IPS: 172.18.0.1
    volumes:
      # Edit server/accounts.json on the host; it is picked up without rebuild.
      - ../server/accounts.json:/app/server/accounts.json:ro
      # Rolling logs (daily, 7 kept) land in deploy/logs/signal.log.
      - ./logs:/app/logs
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    # Host networking is required for the relay UDP port range.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    restart: unless-stopped
